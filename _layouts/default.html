<!doctype html>
<html lang="{{ page.lang | escape }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  {% include meta-tags.html %}
  {% include structured-data.html %}
  <link rel="icon" href="{{ '/src/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="icon" href="{{ '/src/assets/images/favicon-512.png' | relative_url }}" type="image/png" sizes="512x512">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/src/style.css' | relative_url }}">
  <script>
    try {
      const theme = localStorage.getItem("ovenbird-theme");
      if (theme === "dark" || theme === "light") {
        document.documentElement.dataset.theme = theme;
      }
    } catch {}
  </script>
</head>
<body{% if page.body_class %} class="{{ page.body_class | escape }}"{% endif %}>
  <div id="topo">
    {% include header.html %}
    {{ content }}
    {% include footer.html %}
  </div>
  <script src="{{ '/src/script.js' | relative_url }}"></script>
  {% include google-analytics.html %}
</body>
</html>
